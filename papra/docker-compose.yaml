services:
  papra:
    container_name: papra
    image: ghcr.io/papra-hq/papra:latest
    restart: unless-stopped
    ports:
      - "1221:1221"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - APP_BASE_URL=${APP_BASE_URL}
    volumes:
      - ./app-data:/app/app-data
    user: "${UID}:${GID}"
