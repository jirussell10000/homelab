services:
  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - 8096:8096/tcp
    volumes:
      - /home/user/.config/jellyfin:/config
      - /home/user/.cache/jellyfin:/cache
      - type: bind
        source: /home/user/Movies
        target: /Movies
        read_only: true
      - type: bind
        source: /home/user/Music
        target: /Music
        read_only: true
    restart: unless-stopped
    # environment:
      # - JELLYFIN_PublishedServerUrl=<add-url>
    # extra_hosts:
      # - 'host.docker.internal:host-gateway'


